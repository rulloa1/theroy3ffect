<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="favGoldGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#FFF2D1" />
      <stop offset="25%" stop-color="#F5DC9E" />
      <stop offset="50%" stop-color="#DFBA73" />
      <stop offset="80%" stop-color="#BA8E3C" />
      <stop offset="100%" stop-color="#966C22" />
    </linearGradient>
    <linearGradient id="favRingGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFBA73" />
      <stop offset="50%" stop-color="#F5DC9E" />
      <stop offset="100%" stop-color="#966C22" />
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="20" fill="#030014" />

  <!-- Outer Circular Reticle Ring -->
  <circle
    cx="50"
    cy="50"
    r="44"
    stroke="url(#favRingGold)"
    stroke-width="2"
    stroke-dasharray="80 4 4 4"
  />

  <!-- Inner Concentric Fine Ring -->
  <circle
    cx="50"
    cy="50"
    r="38"
    stroke="url(#favRingGold)"
    stroke-width="1.2"
    stroke-opacity="0.8"
  />

  <!-- Crosshair Cardinal Diamond Ticks -->
  <polygon points="50,2 53,7 50,12 47,7" fill="url(#favGoldGrad)" />
  <polygon points="50,98 53,93 50,88 47,93" fill="url(#favGoldGrad)" />
  <polygon points="2,50 7,53 12,50 7,47" fill="url(#favGoldGrad)" />
  <polygon points="98,50 93,53 88,50 93,47" fill="url(#favGoldGrad)" />

  <!-- Gold Letter 'R' with Connector Notch -->
  <path d="M 31 24 H 42.5 V 76 H 31 Z" fill="url(#favGoldGrad)" />
  <path
    d="M 42.5 24 H 60 C 71 24 77 30 77 40 C 77 48 70 54 59 54 H 42.5 V 24 Z 
       M 42.5 33 V 45 H 58 C 62.5 45 66 43 66 40 C 66 37 62.5 33 58 33 H 42.5 Z"
    fill="url(#favGoldGrad)"
  />
  <path d="M 66 38 H 74 V 42 H 66 Z M 74 36.5 H 76 V 43.5 H 74 Z" fill="url(#favGoldGrad)" />
  <path d="M 52.5 50 L 73 76 H 60 L 42.5 54 H 50 Z" fill="url(#favGoldGrad)" />
</svg>

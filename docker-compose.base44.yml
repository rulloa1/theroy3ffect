services:
  web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: sh -c "npm install && npx vite dev --host 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    environment:
      # Platform-provided: lets Vite >= 6.1 accept the preview's external hostname
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      # Let the lovable vite config know we're in dev mode
      - NODE_ENV=development
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  node_modules:
